# 어디가지? 추천 서버 설정. 수치는 모두 튜닝 대상이다.
timezone: Asia/Seoul
random_seed: null          # 정수로 두면 장소 선택·가명 템플릿이 재현 가능 (테스트/시연용)
log_level: INFO
alias_mode: template       # template(시연 기본, LLM 미호출) | llm(Ollama 생성 + 템플릿 폴백)

# 다리로 육지와 이어지지 않은 땅. 출발지와 같은 땅에 있는 후보만 추천한다.
# 출발지의 땅 = 반경 안에서 가장 가까운 관광지(origin_landmass_max_km 이내)의 땅. 위에서부터 첫 번째로 맞는 그룹.
# 근거: 제주시 120분 → 완도 섬 25곳, 서울 120분 → 옹진군 섬 48곳이 후보에 들어옴 (2026-11-11 실측)
origin_landmass_max_km: 15
landmasses:
  - {name: 추자도, regn: ["50"], addr_contains: [추자면]}
  - {name: 우도, regn: ["50"], addr_contains: [우도면]}
  - {name: 제주, regn: ["50"]}
  - {name: 울릉도, regn_signgu: ["47_940"]}
  - {name: 옹진 섬, regn_signgu: ["28_720"], addr_exclude: [영흥면]}   # 영흥면은 영흥대교로 연결

tour_api:
  base_url: https://apis.data.go.kr/B551011/KorService2
  timeout_s: 10
  mobile_app: eodigaji
  content_type_id: 12      # 관광지

source:                    # 전국 관광지 목록을 하루 1회 일괄 수집 → 거리 계산은 로컬
  bulk_page_size: 5000     # 명세에 최대값 없음. 거부되면 1000 으로 낮춘다
  refresh_hours: 24

cache:
  dir: data/cache
  detail_ttl_days: 7       # 상세(소개·주차·운영·요금), content_id 기준
  ref_ttl_days: 30         # 신분류 이름, 법정동 시·군·구 이름

# 직선 반경 = (구간별 속도로 drive_minutes 동안 가는 거리) / 우회계수
radius:
  detour_factor: 1.3
  min_radius_km: 3.0
  speed_segments:
    - {until_min: 30, kmh: 30}     # 처음 30분
    - {until_min: null, kmh: 60}   # 이후

drive_minutes: {min: 15, max: 120}

candidates:
  max_candidates: 20       # 1차 점수 상위 N개만 다음 단계로
  min_for_keyword: 3       # /keywords: 후보가 이보다 적으면 비활성
  finalists: 3             # 상세조회 + 가중 랜덤 대상
  max_detail_lookups: 6    # 휴무로 탈락 시 보충 조회 상한
  # 교통시설, 교육시설, 산업관광, 동상 (신분류 코드 접두어)
  exclude_lcls_prefixes: [VE11, VE09, EX06, VE010500]

scoring:
  kw_class: 1.0            # 신분류 일치
  kw_text: 0.5             # 제목·소개글 단어 일치
  time_base: 0.5           # 노을·야경: 기반 분류 일치
  time_text: 0.5           # 노을·야경: 텍스트 가산
  multi_bonus: 0.3         # 고른 키워드 2개 이상 동시 매칭 시 추가 1개당
  w_keyword: 1.0
  band_low: 0.6            # 예상 운전시간 / drive_minutes 가 [band_low, band_high] 이면 거리 점수 1.0
  band_high: 1.0           # 초과하면 제외
  near_floor: 0.3          # 0km 에 가까울 때 거리 점수
  w_distance: 1.0
  info_image: 0.25
  info_overview: 0.25
  closed_at_arrival_penalty: 0.5   # 운영시간상 도착 시 닫혀 있을 때 (휴무일은 제외 처리)
  min_weight: 0.05

time_windows:
  sunset_before_min: 60
  sunset_after_min: 20
  night_after_sunset_min: 30
  night_until: "23:00"

season_rules:
  - months: [11]
    keywords: [forest, walk, quiet]
    text: [단풍]
    bonus: 0.3

alias:
  ollama_url: http://localhost:11434
  model: llama3.2:1b
  timeout_s: 8             # 재시도 포함 전체 예산
  max_retries: 2
  temperature: 1.0
  min_len: 5               # 공백 포함 글자 수
  max_len: 20
  recent_size: 20

bounds:                    # 대한민국 대략 범위 밖이면 INVALID_LOCATION
  lat_min: 33.0
  lat_max: 38.7
  lng_min: 124.5
  lng_max: 131.9
