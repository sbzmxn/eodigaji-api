# 힐링 키워드 ↔ 한국관광공사 신분류(lclsSystm3) 매핑.
# lcls: 분류 일치(1.0) / title: 제목·소개글 단어 일치(0.5)
# 일출·노을·야경: base 키워드의 '분류'에 맞아야 후보(필수), text 는 가산점.
# 근거: docs/EVALUATION.md (2026-11-11 실측)

# 섬(NA020500)의 바다/물가 판정: 같은 시·군·구에 아래 분류(항구/포구, 해안절경, 해변·해수욕장, 등대)가
# 하나라도 있으면 바다의 섬, 없으면 강·호수의 섬(서래섬, 하중도, 자라섬 등 → water).
# 실측: 섬 274곳 중 12곳이 강·호수의 섬으로 분류되고 모두 실제 하천·호수·운하의 섬 (2026-11-11)
coastal_lcls: [NA020700, NA020800, NA020900, VE010800]

keywords:
  sea:
    label: 바다
    lcls: [NA020500, NA020600, NA020700, NA020800, NA020900, VE010800]  # 섬, 염전, 항구/포구, 해안절경, 해변·해수욕장, 등대
    inland_exclude_lcls: [NA020500]   # 강·호수의 섬은 바다가 아님
    title: [해수욕장, 해변, 해안, 포구, 등대, 바다]
  water:
    label: 호수·강
    lcls: [NA020100, NA020200, NA020300, NA020400, NA010300, NA010400, VE010700]  # 강, 호수, 저수지, 연못·늪, 폭포, 계곡, 댐
    inland_only_lcls: [NA020500]      # 강·호수의 섬은 물가로
    title: [호수, 강변, 저수지, 계곡, 폭포]
  forest:
    label: 숲
    lcls: [NA010200, NA040500, NA040600, NA040700, NA040100, NA040200, NA040300, NA030400]  # 숲, 생태관광지, 자연휴양림, 수목원·정원, 국립/도립/군립공원, 생태습지
    title: [수목원, 휴양림, 숲]
  walk:
    label: 산책
    lcls: [VE030100, VE030400, VE030500, VE040300]  # 시민공원, 근린공원, 주제공원, 둘레길
    title: [둘레길, 산책, 강변]
  view:
    label: 전망
    lcls: [VE010200, NA010100]        # 타워/전망대, 산·고개·오름·봉우리
    title: [전망대, 전망, 타워]
  quiet:
    label: 고즈넉
    lcls: [HS030100, HS010400, HS010500, HS010600, EX040100, EX040200]  # 불교, 고택, 생가, 민속마을, 템플스테이, 사찰문화체험
    title: [고택, 한옥, 서원, 향교, 종택]
  sunrise:
    label: 일출
    time_window: sunrise
    base: [sea, water, view]
    text: [일출, 해돋이]
  sunset:
    label: 노을
    time_window: sunset
    base: [sea, water, view]
    text: [노을, 일몰, 석양, 해넘이]
  night:
    label: 야경
    time_window: night
    base: [view, walk]
    extra_lcls: [VE010300]            # 다리/대교
    text: [야경]
