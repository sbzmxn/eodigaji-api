# 가명(blind_name) 규칙. 목적지를 예측할 수 없는 추상적·감성적 표현만 허용한다.
# LLM 입력에는 장소 정보(이름·소개·분류·키워드)를 넣지 않는다: 시간대 + '힐링' 분위기 + 무작위 느낌 단어만.

# LLM 에 무작위로 하나 건네는 느낌 단어 (장소를 암시하지 않는 말만)
moods: [설렘, 쉼, 고요, 다정함, 기대, 느긋함, 포근함, 여유, 위로, 두근거림, 새로움, 평온]

# 장소 유형어 (키워드 표시어·신분류 이름과 함께 금지어가 된다)
extra_forbidden:
  [바다, 바닷, 해변, 해안, 해수욕, 파도, 갯벌, 포구, 항구, 등대, 섬, 호수, 강, 강변, 저수지, 연못, 냇물, 개울,
   계곡, 폭포, 숲, 나무, 수목원, 정원, 휴양림, 공원, 둘레길, 산책, 산, 봉우리, 고개, 언덕, 전망, 전망대, 타워,
   절, 사찰, 암자, 템플, 고택, 한옥, 서원, 향교, 마을, 노을, 일몰, 석양, 해넘이, 야경, 별빛, 물결, 물가, 꽃,
   단풍, 습지, 동굴, 다리, 대교, 박물관, 미술관, 성당, 교회, 황혼]

# 금지어 검사 전에 지워 두는 예외 단어 (예: '기다리'의 '다리', '계절'의 '절')
allow_words: [기다리, 계절, 시절, 순간, 산들, 문득, 성큼, 다정, 다정한, 다정함, 강아지]

# 조합형 템플릿: (공통 수식어 + 도착 시간대 수식어) × 감성 명사. 금지어 검증은 그대로 적용된다.
template_modifiers:
  any: [오늘의, 아직 모르는, 비밀스러운, 나만 아는, 숨겨진, 설레는, 이름 없는, 아무도 모르는, 기대되는, 포근한, 다정한, 느긋한]
  오전: [오전의, 아침을 여는, 하루를 시작하는, 이른 하루의, 상쾌한 아침의]
  오후: [오후의, 나른한 오후의, 느긋한 오후의, 한낮의, 오후에 만나는]
  저녁: [저녁의, 하루 끝의, 퇴근길의, 저녁에 만나는, 하루를 닫는]
  밤: [밤의, 늦은 밤의, 고요한 밤의, 잠들기 전의, 오늘 밤의]
template_nouns: [쉼표, 쉼터, 비밀, 선물, 휴식, 틈새, 여유, 자리, 모험, 약속, 보물, 상자, 이야기, 안식처, 아지트,
                 목적지, 한 페이지, 숨 고르기, 작은 행복, 쉬는 시간]

# 고정 템플릿 (시간대 무관. 모두 검증 규칙을 통과해야 한다 — tests/test_alias.py)
templates:
  - 비밀의 공간
  - 오늘의 힐링 공간
  - 아직 이름 없는 쉼표
  - 아무도 모르는 쉼터
  - 지도에 없는 쉼표
  - 오늘만 열리는 틈새
  - 숨겨둔 작은 선물
  - 이름을 감춘 휴식처
  - 마음이 쉬어가는 곳
  - 천천히 도착할 비밀
  - 설렘이 기다리는 곳
  - 아직 열지 않은 상자
  - 오늘의 작은 모험
  - 숨 고르는 시간
  - 기대가 머무는 자리
  - 마음 한편의 쉼터
  - 이름 없는 휴식
  - 조용히 기다리는 곳
  - 오늘을 위한 선물
  - 비밀스러운 쉼표
  - 아직 모르는 행복
  - 다정한 비밀 장소
  - 한숨 돌리는 자리
